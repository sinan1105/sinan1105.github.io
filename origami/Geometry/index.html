
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Origami Hats</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

<header class="topbar">
    <a href="../index.html" class="back-btn">
        ← Back to Origami Gallery
    </a>
</header>

<main class="gallery-page">

    <section class="hero">
        <h1>Geometry Drawings</h1>
       
    </section>

    <section class="category-grid">
        

        <div class="category-card reveal">

            <img src="geo1.jpg"
                 alt="Geometrical Eye"
                 style="width:100%; border-radius:12px; margin-bottom:1rem;"
                 class="model-image lightbox-image">

            <h2>Geometrical Eye</h2>

            <p>
                Geometry and illusion.
            </p>

        </div>

        <div class="category-card reveal">

            <img src="geo2.jpg"
                 alt="Mini Hat"
                 style="width:100%; border-radius:12px; margin-bottom:1rem;"
                 class="model-image lightbox-image">

            <h2>Infinity</h2>

            <p>
                Infnity in Mathematics which is not a number.
            </p>

        </div>
        <div class="category-card reveal">

            <img src="geo3.jpg"
                 alt="Spider Man"
                 style="width:100%; border-radius:12px; margin-bottom:1rem;"
                 class="model-image lightbox-image">

            <h2>Spider Man</h2>

            <p>
                Pixel Art of Spider Man.
            </p>

        </div>
        <div class="category-card reveal">

            <img src="geo4.jpg"
                 alt="Pikachu"
                 style="width:100%; border-radius:12px; margin-bottom:1rem;"
                 class="model-image lightbox-image">

            <h2>Pikachu</h2>

            <p>
                Pixel Art of Pikachu.
            </p>

        </div>
       
        
       
        

    </section>
    

</main>

<div id="lightbox" class="lightbox">
    <span class="close-btn">&times;</span>
    <img id="lightbox-img">
    <button class="nav-btn prev">&#10094;</button>
    <button class="nav-btn next">&#10095;</button>
</div>

<script src="../script.js"></script>
</body>
</html>
